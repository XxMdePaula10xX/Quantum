<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- permite pinça-zoom (WCAG 1.4.4); o tap rápido dos minigames é
         preservado por touch-action: manipulation nos botões/abas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07091a" />
    <!-- Fonte de display carregada de forma NÃO bloqueante: o boot nunca espera
         a rede (essencial no app empacotado); cai em system-ui até a Sora chegar
         e degrada para system-ui se offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap"
      />
    </noscript>
    <title>Quantum</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Mostra erros que acontecem ANTES do React montar (module-eval no
         WKWebView), evitando tela branca sem diagnóstico. -->
    <div id="boot-error" style="display:none;color:#ff9aa6;font:14px/1.4 system-ui;padding:24px;white-space:pre-wrap"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
