# Codemagic CI/CD — empacota o web app (Vite) em APK Android via Capacitor.
# Doc do passo a passo: PUBLISH.md
#
# Há 2 workflows:
#   android-test    -> APK de DEBUG, instalável no celular, SEM precisar de
#                      assinatura. Use para testar o app real. Funciona "de cara".
#   android-release -> AAB assinado para a Play Store. Requer keystore + grupo de
#                      variáveis (ver PUBLISH.md). Deixe para quando for publicar.

workflows:
  android-test:
    name: Quantum · APK de teste (debug)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
      # Para ligar login/ranking no app empacotado, crie no Codemagic um grupo
      # de variáveis chamado "firebase" com as chaves VITE_FIREBASE_* e descomente:
      # groups:
      #   - firebase
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Gerar .env do Firebase (opcional — vazio se não definido)
        script: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
          VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
          VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
          VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
          VITE_FIREBASE_SENDER_ID=${VITE_FIREBASE_SENDER_ID}
          VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
          EOF
      - name: Build do web (Vite)
        script: npm run build
      - name: Sincronizar Capacitor
        script: npx cap sync android
      - name: Build do APK (debug)
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - matheuscastrodepaula@gmail.com

  android-release:
    name: Quantum · AAB assinado (Play Store)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
      groups:
        - firebase # VITE_FIREBASE_* (ver PUBLISH.md)
      android_signing:
        - quantum_keystore # keystore enviado no Codemagic (ver PUBLISH.md)
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Gerar .env do Firebase
        script: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
          VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
          VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
          VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
          VITE_FIREBASE_SENDER_ID=${VITE_FIREBASE_SENDER_ID}
          VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
          EOF
      - name: Build do web (Vite)
        script: npm run build
      - name: Sincronizar Capacitor
        script: npx cap sync android
      - name: Build do AAB (release)
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - matheuscastrodepaula@gmail.com

  # ----------------------------------------------------------------------------
  # iOS (precisa de macOS — o Codemagic fornece). SEM CocoaPods (Capacitor 8 usa
  # Swift Package Manager). Ver PUBLISH.md.

  ios-simulator:
    name: Quantum · iOS (build de simulador, sem assinatura)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Gerar .env do Firebase (opcional)
        script: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
          VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
          VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
          VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
          VITE_FIREBASE_SENDER_ID=${VITE_FIREBASE_SENDER_ID}
          VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
          EOF
      - name: Build do web (Vite)
        script: npm run build
      - name: Sincronizar Capacitor (iOS)
        script: npx cap sync ios
      - name: Compilar para o simulador (sem assinar)
        script: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
    # Sem artefato instalável: confirma só que o app COMPILA no iOS (não exige
    # conta Apple). Para rodar no iPhone, use o workflow ios-testflight abaixo.

  ios-testflight:
    name: Quantum · iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: quantum_asc # chave da App Store Connect (ver PUBLISH.md)
    environment:
      node: 22
      xcode: latest
      groups:
        - firebase
      vars:
        BUNDLE_ID: 'com.matheus.quantum'
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Gerar .env do Firebase
        script: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
          VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
          VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
          VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
          VITE_FIREBASE_SENDER_ID=${VITE_FIREBASE_SENDER_ID}
          VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
          EOF
      - name: Build do web (Vite)
        script: npm run build
      - name: Sincronizar Capacitor (iOS)
        script: npx cap sync ios
      - name: Assinatura (CRIA certificado + perfil se não existir)
        script: |
          set -x
          keychain initialize
          # diagnóstico: lista os certificados de distribuição existentes
          app-store-connect list-certificates --type IOS_DISTRIBUTION || true
          # --create cria o certificado de distribuição e o perfil App Store
          # caso ainda não existam (app novo) — usa a chave quantum_asc.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --platform IOS
          keychain add-certificates
          xcode-project use-profiles --project "ios/App/App.xcodeproj"
      - name: Build do IPA (assinado)
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - matheuscastrodepaula@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true

