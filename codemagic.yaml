# Codemagic CI/CD — empacota o web app (Vite) em APK Android via Capacitor.
# Doc do passo a passo: PUBLISH.md
#
# Há 2 workflows:
#   android-test    -> APK de DEBUG, instalável no celular, SEM precisar de
#                      assinatura. Use para testar o app real. Funciona "de cara".
#   android-release -> AAB assinado para a Play Store. Requer keystore + grupo de
#                      variáveis (ver PUBLISH.md). Deixe para quando for publicar.

workflows:
  android-test:
    name: Quantum · APK de teste (debug)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
      java: 21
      # Para ligar login/ranking no app empacotado, crie no Codemagic um grupo
      # de variáveis chamado "firebase" com as chaves VITE_FIREBASE_* e descomente:
      # groups:
      #   - firebase
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Gerar .env do Firebase (opcional — vazio se não definido)
        script: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
          VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
          VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
          VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
          VITE_FIREBASE_SENDER_ID=${VITE_FIREBASE_SENDER_ID}
          VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
          EOF
      - name: Build do web (Vite)
        script: npm run build
      - name: Sincronizar Capacitor
        script: npx cap sync android
      - name: Build do APK (debug)
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - matheuscastrodepaula@gmail.com

  android-release:
    name: Quantum · AAB assinado (Play Store)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
      java: 21
      groups:
        - firebase # VITE_FIREBASE_* (ver PUBLISH.md)
      android_signing:
        - quantum_keystore # keystore enviado no Codemagic (ver PUBLISH.md)
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Gerar .env do Firebase
        script: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
          VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
          VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
          VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
          VITE_FIREBASE_SENDER_ID=${VITE_FIREBASE_SENDER_ID}
          VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
          EOF
      - name: Build do web (Vite)
        script: npm run build
      - name: Sincronizar Capacitor
        script: npx cap sync android
      - name: Build do AAB (release)
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - matheuscastrodepaula@gmail.com
